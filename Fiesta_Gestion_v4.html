<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiesta · Gestion</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f5;--sf:#fff;--tx:#17252a;--mu:#5d6d73;--ln:#dde3e5;--pr:#0075b3;--pt:#fff;--wa:#b7791f;--er:#b42318;--ok:#18794e;--soft:#e1f2fb;--ac:#e2007a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1719;--sf:#172326;--tx:#e8eff0;--mu:#93a6ab;--ln:#2a3a3e;--pr:#4cc3f5;--pt:#04202e;--ac:#ff4fa3;--wa:#e5b34d;--er:#f08a7e;--ok:#5cc596;--soft:#12303f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1719;--sf:#172326;--tx:#e8eff0;--mu:#93a6ab;--ln:#2a3a3e;--pr:#4cc3f5;--pt:#04202e;--ac:#ff4fa3;--wa:#e5b34d;--er:#f08a7e;--ok:#5cc596;--soft:#12303f;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.45 Manrope,system-ui,sans-serif;min-height:100vh}
header{background:var(--sf);border-bottom:3px solid var(--ac);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.top b{font-weight:800;font-size:17px}.top small{color:var(--mu)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 10px 8px}
nav button{white-space:nowrap;border:0;background:none;color:var(--mu);font:600 14px Manrope,system-ui;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--soft);color:var(--pr)}
main{max-width:980px;margin:0 auto;padding:14px}
h2{font-size:20px;margin:6px 0 12px;font-weight:800}h3{font-size:15px;margin:0 0 8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px}
.k span{color:var(--mu);font-size:13px}.k b{display:block;font-size:19px;font-weight:800;margin-top:2px}
.k.big{background:var(--pr);color:var(--pt);border-color:var(--pr)}.k.big span{color:inherit;opacity:.85}
.er{color:var(--er)}.ok{color:var(--ok)}.wa{color:var(--wa)}.mu{color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mu);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--ln)}
td{padding:8px;border-bottom:1px solid var(--ln);vertical-align:middle}
.sc{overflow-x:auto}.r{text-align:right}
input,select,button.b{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-height:38px}
input[type=checkbox]{min-height:0;width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.row>input,.row>select{flex:1;min-width:110px}
button.b{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:600;cursor:pointer}
button.b.g{background:var(--sf);color:var(--tx);border-color:var(--ln)}
button.b.d{background:var(--er);border-color:var(--er);color:#fff}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;background:var(--soft);color:var(--pr)}
.chip.er{background:color-mix(in srgb,var(--er) 15%,transparent);color:var(--er)}
.chip.wa{background:color-mix(in srgb,var(--wa) 18%,transparent);color:var(--wa)}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.login{max-width:380px;margin:8vh auto;padding:0 14px}
.login .card{padding:18px}
.role{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:600 15px Manrope,system-ui;cursor:pointer}
.role.on{border-color:var(--pr);background:var(--soft)}
.role small{display:block;font-weight:400;color:var(--mu)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9;display:none;max-width:90vw}
.logo{background:#fff;border-radius:8px;display:block}
svg text{fill:var(--mu);font:11px Manrope,system-ui}
@media print{header,.np,#toast{display:none!important}body{background:#fff;color:#000}.card,.k{break-inside:avoid}}
.inv th,.inv td{white-space:nowrap;padding:6px 7px;font-size:13px}.inv th{background:var(--sf);color:var(--mu);vertical-align:bottom}
.inv td:first-child,.inv th:first-child{position:sticky;left:0;background:var(--sf);z-index:1;box-shadow:1px 0 0 var(--ln)}
.inv input{width:82px;min-height:34px;padding:4px 6px}.inv tfoot td{font-weight:800;background:var(--soft)}
.inv .gt td{font-weight:800;background:var(--soft)}.inv .gh td{font-weight:800;color:var(--pr);background:var(--bg);text-transform:uppercase;font-size:12px}.inv small{display:block;color:var(--mu);font-weight:400}.inv select{min-height:28px;padding:2px 4px;font-size:12px;margin-top:2px}
details.card summary{cursor:pointer;font-weight:700}.leg{font-size:12px;color:var(--mu);margin:8px 2px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cd{position:relative;min-height:40px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:600 13px Manrope,system-ui;cursor:pointer;padding:0}.cd.td{border-color:var(--pr)}.cd.sl{background:var(--pr);color:var(--pt)}.cd i{position:absolute;right:3px;bottom:2px;font-size:10px;font-style:normal;background:var(--er);color:#fff;border-radius:8px;padding:0 5px}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
</style></head><body>

const bal=i=>i.total-i.paid, late=i=>bal(i)>0&&i.due<ago(0);

async function hp(p,s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;const t=s+':'+p;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return'x'+h}}
const rnd=()=>{try{return[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return String(Math.random()).slice(2)}};

const SB={products:['products','h'],clients:['clients','h'],sup:['sup','h'],sales:['sales','date'],expenses:['expenses','d'],mv:['mv','date'],cash:['cash','date'],log:['log','t'],ev:['ev','date'],btx:['bank.tx','date'],bacc:['bank.acc','h'],days:['inv.days','date'],imp:['inv.imp','h']};

function lmap(){const m={};for(const t of Object.keys(SB)){const[p,k]=SB[t];gp(p).forEach(it=>{if(it.id==null)it.id=uid();m[t+'/'+it.id]={t,id:String(it.id),b:bkt(k,it),it}})}
 Object.entries(S.flux||{}).forEach(([d,x])=>{m['flux/'+d]={t:'flux',id:d,b:d,it:{...x,id:d}}});
 const c={set:S.set,open:S.inv.open,deb:S.inv.deb||0,rec:S.inv.rec||0,cnt:S.n||0};Object.entries(c).forEach(([k,v])=>{m['cfg/'+k]={t:'cfg',id:k,b:'one',it:{v}}});return m}
const pristine=()=>!S.products.length&&!S.sales.length&&!S.clients.length&&!S.expenses.length&&!S.mv.length&&!S.cash.length&&!S.ev.length;
function applyItem(t,id,it){if(t==='cfg'){const v=it?it.v:undefined;if(v===undefined)return;if(id==='set')S.set=v;else if(id==='open')S.inv.open=v;else if(id==='deb')S.inv.deb=v;else if(id==='rec')S.inv.rec=v;else if(id==='cnt')S.n=v;return}
 if(t==='flux'){if(it){const x=cl(it);delete x.id;S.flux[id]=x}else delete S.flux[id];return}
 const a=gp(SB[t][0]),i=a.findIndex(x=>String(x.id)===id);if(it){const x=cl(it);if(i>=0)a[i]=x;else a.push(x)}else if(i>=0)a.splice(i,1)}
const norm=x=>{const y=cl(x);if(y._x===null||y._x===undefined)delete y._x;return y};
function reconcile(ids){let ch=false;const L=lmap(),rk={};
 ids.forEach(did=>{const t=did.split('~')[0],it=SY.rem[did]||{};Object.keys(it).forEach(id=>{rk[t+'/'+id]=it[id]})});
 Object.keys(rk).forEach(k=>{const[t,...rr]=k.split('/'),id=rr.join('/'),rv=norm(rk[k]),b=SY.base[k],l=L[k],bh=b?b.h:null;
  if(rv._x){if(l){if(bh!==null&&hj(l.it)===bh){applyItem(t,id,null);ch=true}}if(!l||hj(l.it)===bh)delete SY.base[k];return}
  const rh=hj(rv),bk=l?l.b:(b?b.b:SY.rb(t,rv));
  if(!l){if(bh===null){applyItem(t,id,rv);SY.base[k]={h:rh,b:bk};ch=true}return}
  const lh=hj(l.it);
  if(rh===lh){SY.base[k]={h:rh,b:l.b};return}
  if(t==='cfg'&&bh===null&&!pristine()&&Object.keys(SY.base).length===0&&false)return;
  if(bh===null||lh===bh||rh!==bh){applyItem(t,id,rv);SY.base[k]={h:rh,b:l.b};ch=true}});
 if(ch){mig();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}saveBase();refreshUI()}}
SY.rb=(t,it)=>{const k=SB[t]?SB[t][1]:'one';return t==='cfg'?'one':t==='flux'?it.id:bkt(k,it)};

function diffOps(){const L=lmap(),ops={},O=d=>ops[d]||(ops[d]={items:{},keys:{}}),skipCfg=pristine();
 for(const[k,l]of Object.entries(L)){if(l.t==='cfg'&&skipCfg)continue;const h=hj(l.it),b=SY.base[k];if(!b||b.h!==h||b.b!==l.b){const o=O(l.t+'~'+l.b);o.items[l.id]={...cl(l.it),_x:null};o.keys[k]={h,b:l.b};if(b&&b.b!==l.b)O(l.t+'~'+b.b).items[l.id]={_x:1}}}
 for(const k of Object.keys(SY.base)){if(!L[k]){const b=SY.base[k],[t,...r]=k.split('/'),o=O(t+'~'+b.b);o.items[r.join('/')]={_x:1};o.keys[k]=null}}
 return ops}
async function wr(did,items){const ref=SY.db.doc('b/'+did);try{await ref.update({items})}catch(e){if(e&&e.code==='invalid_argument')await ref.set({items});else throw e}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function schedulePush(){if(!SY.db||!SY.ready||SY.ro)return;if(SY.busy){SY.again=true;return}clearTimeout(SY.timer);SY.timer=setTimeout(pushLocal,1500)}
async function pushLocal(){if(!SY.db||!SY.ready||SY.ro||SY.busy)return;SY.busy=true;setSt('wait');let ok=true;
 try{const ops=diffOps();for(const did of Object.keys(ops)){const o=ops[did];let chunk={},size=0;const flush=async()=>{if(Object.keys(chunk).length){await wr(did,chunk);await wait(60)}chunk={};size=0};
   for(const[id,it]of Object.entries(o.items)){const n=JSON.stringify(it).length;if(size+n>150000)await flush();chunk[id]=it;size+=n}await flush();
   Object.entries(o.keys).forEach(([k,v])=>{if(v)SY.base[k]=v;else delete SY.base[k]})}
  saveBase();SY.last=new Date().toISOString();SY.err='';setSt('ok')}
 catch(e){ok=false;synErr(e)}
 SY.busy=false;if(SY.def.size){const d=SY.def;SY.def=new Set();reconcile(d)}if(SY.again&&ok){SY.again=false;schedulePush()}}
function synErr(e){const c=e&&e.code;if(c==='invalid_argument'){SY.err=SY.canW===false?'':'Écriture refusée (droits insuffisants ou document trop volumineux).';if(SY.canW!==true){SY.ro=true;setSt('ro')}else setSt('err')}
 else if(c==='quota_exceeded'){SY.err='Capacité de la base partagée atteinte.';setSt('err')}
 else if(c==='revoked'){SY.ro=true;SY.err='Accès retiré.';setSt('ro')}
 else{SY.err='Connexion instable, nouvel essai automatique.';setSt('off');clearTimeout(SY.timer);SY.timer=setTimeout(()=>{SY.busy||pushLocal()},8000)}}
function onRemote(snap){const ids=new Set();snap.docChanges().forEach(c=>{const did=c.doc.id;ids.add(did);if(c.type==='removed')delete SY.rem[did];else SY.rem[did]=(c.doc.data()||{}).items||{}});
 if(SY.busy)ids.forEach(x=>SY.def.add(x));else reconcile(ids);
 if(!SY.ready&&!snap.metadata.fromCache){SY.ready=true;setSt(SY.ro?'ro':'wait');if(!SY.ro)pushLocal();else{setSt('ro')}}}
const MSK=K+'-ms',msCfg=()=>{try{return JSON.parse(localStorage.getItem(MSK))}catch(e){return null}};
function msDb(c){const H={'Content-Type':'application/json','x-api-key':c.key},u=c.url.replace(/\/+$/,'');
 const j=async(m,p,b)=>{let r;try{r=await fetch(u+p,{method:m,headers:H,body:b?JSON.stringify(b):undefined})}catch(e){throw{code:'unavailable',message:'Serveur injoignable'}}
  if(r.status===401||r.status===403)throw{code:'invalid_argument',message:'Clé d’accès refusée'};if(r.status===507)throw{code:'quota_exceeded',message:'Base pleine'};if(!r.ok)throw{code:'unavailable',message:'Erreur '+r.status};return r.status===204?null:r.json()};
 return{_ms:1,ping:()=>j('GET','/ping'),
  doc:q=>{const id=encodeURIComponent(q.split('/')[1]);return{update:d=>j('PATCH','/docs/'+id,d).then(()=>{}),set:d=>j('PUT','/docs/'+id,d).then(()=>{})}},
  collection:()=>({onSnapshot(next,err){let seen={},first=true,stop=false,tm,since='';
   const tick=async()=>{if(stop)return;try{const r=await j('GET','/docs'+(since?'?since='+encodeURIComponent(since):'')),ch=[];(r.docs||[]).forEach(d=>{if(d.updated&&d.updated>since)since=d.updated;const h=hs(JSON.stringify(d.items));if(seen[d.id]!==h){seen[d.id]=h;ch.push({type:'modified',doc:{id:d.id,data:()=>({items:d.items})}})}});
     if(ch.length||first){first=false;next({docChanges:()=>ch,metadata:{fromCache:false}})}}catch(e){if(e.code==='unavailable')synErr(e);else if(err)err(e)}
    if(!stop)tm=setTimeout(tick,(c.every||10)*1000)};tick();return()=>{stop=true;clearTimeout(tm)}}})}}

async function msSave(){const o=msCfg()||{},url=val('ms_url').trim().replace(/\/+$/,''),key=val('ms_key')||o.key||'';if(!/^https:\/\//i.test(url))return toast('Adresse https:// requise');if(!key)return toast('Clé d’accès requise');
 const c={on:true,url,key,every:+val('ms_ev')||10};try{await msDb(c).ping()}catch(e){return toast('Connexion impossible : '+(e.message||'erreur'))}
 try{localStorage.setItem(MSK,JSON.stringify(c))}catch(e){}syStop();startSync(msDb(c),true);log('Base de données Microsoft activée');draw();toast('Base Microsoft activée')}
function msOff(){const o=msCfg()||{};o.on=false;try{localStorage.setItem(MSK,JSON.stringify(o))}catch(e){}syStop();syncInit();log('Base de données Microsoft désactivée');draw();toast('Base Microsoft désactivée')}
async function syNow(){if(!SY.db)return toast('Synchronisation indisponible ici');if(SY.ro)return toast('Lecture seule : rien à envoyer');await pushLocal();toast(SY.st==='ok'?'Synchronisé':'Synchronisation en cours ou impossible')}
function syPull(){Dp=null;if(!SY.db||!SY.ready){draw();return toast('Connexion au serveur indisponible')}S=seed();mig();SY.base={};saveBase();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}reconcile(new Set(Object.keys(SY.rem)));log('Données rechargées depuis le serveur');draw();toast('Données rechargées')}
function addP(){const n=val('pn').trim();if(!n)return toast('Nom requis');if(S.products.some(p=>p.name.toLowerCase()===n.toLowerCase()))return toast('Ce produit existe déjà');const q=+val('pq')||0;S.products.push({id:Date.now(),name:n,cost:(+val('pcc')>0&&+val('pk')>0)?+val('pcc')/+val('pk'):(+val('pc')||0),pack:+val('pk')||0,cat:val('pcat').trim(),price:+val('pp')||0,qty:q,base:q,ent:0,entVal:0,rest:null,fac:0,facm:0,min:+val('pm')||5,loc:val('pl')||S.set.locs[0]});log('Produit ajouté : '+n);draw()}
function addEntry(){const p=S.products.find(x=>x.id==val('es')),q=+val('eq');if(!p)return toast('Choisissez un produit');if(!(q>0))return toast('Nombre entré invalide');
 const c=val('ec'),v=val('ep');if(c!==''&&!(+c>=0))return toast('Valeur d’achat invalide');if(v!==''&&!(+v>=0))return toast('Prix de vente invalide');
 const value=c===''?q*p.cost:+c;const sd0=S.sup.find(x=>x.id==val('esup')),pd0=val('epd');if(pd0!==''&&!(+pd0>=0))return toast('Montant payé invalide');const pa0=sd0&&pd0!==''?Math.min(+pd0,value):value,lk=lack(val('epm')||'c',pa0);if(lk)return toast(lk);p.ent=(p.ent||0)+q;p.entVal=(p.entVal||0)+value;p.qty+=q;p.cost=p.entVal/p.ent;if(v!=='')p.price=+v;const sd=S.sup.find(x=>x.id==val('esup')),pd=val('epd');if(pd!==''&&!(+pd>=0))return toast('Montant payé invalide');
 S.mv.push({t:new Date().toISOString(),date:ago(0),type:'Entrée',pid:p.id,name:p.name,sup:sd?sd.id:0,supN:sd?sd.name:'Sans fournisseur',qty:q,val:value,paid:pa0});payFrom(val('epm')||'c','Achat stock',pa0,`Achat ${p.name} ×${q}`,'A'+uid());
 log(`Entrée en stock : ${p.name} +${q} · valeur d’achat ${M(value)}${v!==''?' · nouveau PV '+v:''}`);draw();toast('Entrée enregistrée')}
function closeDay(){const miss=S.products.filter(p=>!calc(p).ok);if(miss.length){Dp=null;draw();return toast('Complétez le stock réel de : '+miss.slice(0,3).map(p=>p.name).join(', ')+(miss.length>3?'…':''))}
 const rows=S.products.map(p=>{const c=calc(p);return{name:p.name,base:c.base,ent:c.ent,tot:c.tot,vmu:c.vmpe,tvmpe:c.tvmpe,tvmes:c.tvmes,pv:c.pv,iu:c.iu,tie:c.tie,tiv:c.tiv,vend:c.vend,rest:c.rest,mont:c.mont,cout:c.cout}});
 const T=tot(S.products),D=snv(),d={date:ago(0),from:S.inv.open,rows,mont:T.mont,cout:T.cout,deb:D.deb,dep:D.dep,imp:D.imp,rec:D.rec,sn:D.sn,tie:T.tie,tiv:T.tiv,fm:T.fm};
 S.inv.days.push(d);S.flux[d.date]=fluxRow(d.date);S.products.forEach(p=>{const c=calc(p),df=c.rest-p.qty;if(df)S.mv.push({t:new Date().toISOString(),date:ago(0),type:'Ajustement',pid:p.id,name:p.name,sup:0,supN:'Clôture',qty:df,val:0,paid:0});p.qty=c.rest;p.base=c.rest;p.ent=0;p.entVal=0;p.rest=null;p.fac=0;p.facm=0});S.expenses.forEach(e=>{if(!e.k)e.k=ago(0)});S.inv.deb=0;S.inv.rec=0;S.inv.imp=[];S.inv.open=ago(0);Dp=null;
 log(`Inventaire clôturé : vendu ${M(d.mont)} · SN ${M(d.sn)}`);draw();toast('Journée clôturée')}
function addCart(){const p=S.products.find(x=>x.id==val('sp')),q=+val('sq');if(!p||q<1)return;const e=Q.cart.find(l=>l.pid===p.id);if(e)e.qty+=q;else Q.cart.push({pid:p.id,name:p.name,qty:q,price:p.price,cost:p.cost});draw()}
function doSale(){if(!Q.cart.length)return toast('Ajoutez un produit');
 for(const l of Q.cart){const p=S.products.find(x=>x.id===l.pid);if(p.qty<l.qty)return toast('Stock insuffisant : '+p.name)}
 const total=sum(Q.cart,l=>l.qty*l.price);let paid=total;
 if(Q.mode==='credit'){if(!Q.client)return toast('Choisissez un client pour un crédit');paid=Math.min(+Q.paid||0,total);const c=S.clients.find(x=>x.id===Q.client);if(cbal(c.id)+total-paid>c.limit)return toast('Plafond de crédit dépassé')}
 Q.cart.forEach(l=>{const p=S.products.find(x=>x.id===l.pid);p.qty-=l.qty;p.fac=(p.fac||0)+l.qty;p.facm=(p.facm||0)+l.qty*l.price});S.inv.deb=(S.inv.deb||0)+(total-paid);S.n=Math.max(S.n||0,...S.sales.map(i=>parseInt(String(i.no).slice(2),10)||0))+1;const no='F-'+String(S.n).padStart(4,'0');
 S.sales.push({id:uid(),no,date:ago(0),due:ago(-30),client:Q.client,lines:Q.cart.map(l=>({...l})),total,paid,pays:paid?[{d:ago(0),amt:paid,i:1}]:[]});
 recvTo(Q.pm||'c','Vente',`Vente ${no} · ${cname(Q.client)}`,paid,'V'+no);log(`Vente ${no} · ${cname(Q.client)} · ${M(total)}${paid<total?' (crédit)':''}`);Q={cart:[],client:0,mode:'cash',paid:''};P='inv';draw();toast('Facture '+no+' créée')}
function pay(id){const i=S.sales.find(x=>x.id===id),a=Math.min(+val('pay'+id),bal(i));if(!(a>0))return toast('Montant invalide');i.paid+=a;i.pays.push({d:ago(0),amt:a});S.inv.rec=(S.inv.rec||0)+a;recvTo(val('pm'+id)||'c','Recouvrement',`Encaissement ${i.no} · ${cname(i.client)}`,a,'P'+uid());log(`Encaissement ${i.no} · ${M(a)}`);draw();toast('Paiement enregistré')}
function addC(){const n=val('cn').trim();if(!n)return toast('Nom requis');S.clients.push({id:Date.now(),name:n,phone:val('cp'),limit:+val('cl')||0});log('Client ajouté : '+n);draw()}
function addE(){const a=+val('ea'),l=val('el').trim();if(!l||!(a>0))return toast('Libellé et montant requis');addExp(l,a);log(`Dépense : ${l} · ${M(a)}`);draw()}
async function saveAcc(){S.set.drive={prov:val('dp'),email:val('de').trim(),folder:val('df').trim()||'Fiesta',freq:+val('dq'),last:S.set.drive.last};const ch=Object.keys(ROLES).filter(r=>val('pin_'+r).trim());
 if(ch.length){const nv=r=>val('pin_'+r).trim();if(!(await chk('owner',val('pin_cur'))))return toast('Votre code propriétaire actuel est incorrect');
  if(ch.some(r=>nv(r).length<6))return toast('Un code doit avoir 6 caractères minimum');
  if(new Set(ch.map(nv)).size<ch.length)return toast('Chaque profil doit avoir un code différent');
  for(const r of ch)for(const o of Object.keys(ROLES))if(o!==r&&!ch.includes(o)&&S.set.pins[o]&&await chk(o,nv(r)))return toast('Chaque profil doit avoir un code différent');
  for(const r of ch)S.set.pins[r]=await mk(nv(r));log('Codes modifiés : '+ch.map(r=>ROLES[r]).join(', '))}
 ['manager','investor'].forEach(r=>{S.set.perms[r]=['dash','stock','etude','sup','sales','agenda','inv','credit','caisse','bank','fin','rep','flux','hist'].filter(m=>$(`pm_${r}_${m}`).checked)});
 S.set.cur=val('cur')||'FC';S.set.goal=+val('goal')||0;log('Accès et réglages modifiés');draw();toast('Réglages enregistrés')}
async function reset(){if(!Conf){Conf=true;draw();return}if(!(await chk('owner',val('pin_cur'))))return toast('Saisissez votre code propriétaire pour confirmer');Conf=false;S=seed();mig();save();U=null;Pick=null;draw()}
load();draw();syncInit();
</script></body></html>
